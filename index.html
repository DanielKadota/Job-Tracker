<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Job Tracker - gerenciamento de candidaturas para vagas de emprego.">

    <title>Job Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar__brand">

            <div class="sidebar__logo">
                JT
            </div>

            <div>
                <h1 class="sidebar__title">Job Tracker</h1>

                <span class="sidebar__subtitle">
                    Gestão de candidaturas
                </span>
            </div>

        </div>


        <nav class="sidebar__nav" aria-label="Navegação principal">

            <a href="#" class="nav-link nav-link--active">
                <span>▦</span>
                Dashboard
            </a>

            <a href="#" class="nav-link">
                <span>▤</span>
                Candidaturas
            </a>

        </nav>


        <div class="sidebar__footer">

            <span>Job Tracker</span>

            <small>v1.0</small>

        </div>

    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">

            <div>

                <span class="header__greeting">
                    Olá, Daniel 👋
                </span>

                <h2 class="header__title">
                    Acompanhe suas candidaturas
                </h2>

            </div>


            <button type="button" class="button button--primary" id="btnNovaCandidatura">

                <span>+</span>

                Nova candidatura

            </button>

        </header>
        <!-- ESTATÍSTICAS -->
        <section class="stats" aria-label="Resumo das candidaturas">

            <article class="stat-card">

                <div class="stat-card__icon stat-card__icon--blue">
                    ≡
                </div>

                <div>

                    <span class="stat-card__label">
                        Total
                    </span>

                    <strong class="stat-card__value" id="totalCandidaturas">

                        0

                    </strong>

                </div>

            </article>


            <article class="stat-card">

                <div class="stat-card__icon stat-card__icon--yellow">
                    ◷
                </div>

                <div>

                    <span class="stat-card__label">
                        Em análise
                    </span>

                    <strong class="stat-card__value" id="candidaturasAnalise">

                        0

                    </strong>

                </div>

            </article>


            <article class="stat-card">

                <div class="stat-card__icon stat-card__icon--purple">
                    ◉
                </div>

                <div>

                    <span class="stat-card__label">
                        Entrevistas
                    </span>

                    <strong class="stat-card__value" id="candidaturasEntrevista">

                        0

                    </strong>

                </div>

            </article>


            <article class="stat-card">

                <div class="stat-card__icon stat-card__icon--green">
                    ✓
                </div>

                <div>

                    <span class="stat-card__label">
                        Aprovadas
                    </span>

                    <strong class="stat-card__value" id="candidaturasAprovadas">

                        0

                    </strong>

                </div>

            </article>

        </section>
        
    </main>

</body>

</html>
